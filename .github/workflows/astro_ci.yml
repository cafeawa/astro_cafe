name: Astro CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Check Astro types
        run: pnpm check

      - name: Build site and search index
        run: pnpm build
        env:
          PUBLIC_WALINE_SERVER_URL: http://comment.cafenya.top

      - name: Save static site
        uses: actions/upload-artifact@v4
        with:
          name: astro-site
          path: dist/
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: astro-cafe-production
      cancel-in-progress: false
    steps:
      - name: Download static site
        uses: actions/download-artifact@v4
        with:
          name: astro-site
          path: dist/

      - name: Configure deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Publish to Baota HTML site
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          for attempt in 1 2 3; do
            if rsync -az --delete-delay --delay-updates \
              --exclude='.well-known/' \
              --exclude='.user.ini' \
              --exclude='.htaccess' \
              -e "ssh -o StrictHostKeyChecking=yes -p $DEPLOY_PORT" \
              dist/ "$DEPLOY_USER@$DEPLOY_HOST:/www/wwwroot/astro-cafe/"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
